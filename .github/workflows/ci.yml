name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  template-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  templates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [base]
    defaults:
      run:
        working-directory: templates/${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: templates/${{ matrix.template }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Valida que app.config.ts resuelva con el brand.json de ejemplo.
      - run: npx expo config --type public > /dev/null
